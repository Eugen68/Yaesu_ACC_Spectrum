name: Firmware

# Builds the ESP32-S3 firmware with PlatformIO and keeps the merged image
# (bootloader, partition table and app in one file that flashes at address 0)
# as an artifact. ACC Firmware Flasher lists any such .bin put in its firmware
# folder.

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        working-directory: firmware
        run: pio run
      - name: Version
        run: |
          version=$(grep -oP 'FW_VERSION = "\K[^"]+' firmware/src/main.cpp)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: yaesu-acc-firmware-${{ env.VERSION }}
          path: firmware/release/*-merged.bin
          if-no-files-found: error
